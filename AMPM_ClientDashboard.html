<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMPM - Client Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F4ECE3;
  --brown: #864624;
  --brown-light: #a5673f;
  --brown-dark: #6b371c;
  --text: #3a2a1a;
  --text-light: #7a6a5a;
  --white: #fff;
  --border: #e0d5c8;
  --green: #2e7d32;
  --green-light: #e8f5e9;
  --red: #c62828;
  --red-light: #ffebee;
  --blue: #1565c0;
  --blue-light: #e3f2fd;
  --shadow: 0 2px 12px rgba(134,70,36,0.08);
  --shadow-lg: 0 4px 24px rgba(134,70,36,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
}

/* Header */
.header {
  background: var(--brown);
  color: var(--cream);
  padding: 18px 24px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 {
  font-family: 'EB Garamond', serif;
  font-size: 1.8rem;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.header p {
  font-size: 0.75rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.8;
  margin-top: 4px;
}

/* Content */
.content { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

/* Search */
.search-box {
  background: var(--white);
  border-radius: 12px;
  padding: 28px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}
.search-box label {
  display: block;
  font-family: 'EB Garamond', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--brown);
  margin-bottom: 12px;
}
.search-row {
  display: flex;
  gap: 10px;
}
.search-row input {
  flex: 1;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 1rem;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.search-row input:focus { border-color: var(--brown); }
.search-row input::placeholder { color: #bbb; }
.btn {
  padding: 12px 28px;
  border: none;
  border-radius: 8px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.btn-primary {
  background: var(--brown);
  color: var(--cream);
}
.btn-primary:hover { background: var(--brown-dark); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.search-hint {
  font-size: 0.75rem;
  color: var(--text-light);
  margin-top: 8px;
}

/* Client Profile */
.client-profile {
  background: var(--white);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  display: none;
}
.client-name {
  font-family: 'EB Garamond', serif;
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--brown);
  margin-bottom: 4px;
}
.client-meta {
  font-size: 0.82rem;
  color: var(--text-light);
  margin-bottom: 16px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
}
.stat-card {
  background: var(--cream);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.stat-value {
  font-family: 'EB Garamond', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--brown);
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-light);
  margin-top: 4px;
}

/* History Table */
.history-section {
  background: var(--white);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow);
  display: none;
}
.history-section h3 {
  font-family: 'EB Garamond', serif;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--brown);
  margin-bottom: 16px;
}
.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-row select {
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 0.8rem;
  font-family: 'Inter', sans-serif;
  outline: none;
  background: var(--white);
  min-width: 120px;
}
.filter-row select:focus { border-color: var(--brown); }
.view-toggle {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
}
.view-btn {
  padding: 6px 14px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 0.75rem;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  background: var(--white);
  color: var(--text-light);
  font-weight: 500;
  transition: all 0.2s;
}
.view-btn.active {
  background: var(--brown);
  color: var(--cream);
  border-color: var(--brown);
}
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}
thead th {
  background: var(--brown);
  color: var(--cream);
  padding: 9px 10px;
  text-align: left;
  font-weight: 500;
  letter-spacing: 0.3px;
  white-space: nowrap;
  position: sticky;
  top: 0;
}
thead th:first-child { border-radius: 6px 0 0 0; }
thead th:last-child { border-radius: 0 6px 0 0; }
tbody td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
tbody tr:hover { background: rgba(134,70,36,0.03); }
tbody tr:last-child td { border-bottom: none; }
.amt-pos { color: var(--text); font-weight: 500; }
.amt-neg { color: var(--red); font-weight: 500; }
.no-data {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
  font-size: 0.9rem;
}
.record-count {
  font-size: 0.75rem;
  color: var(--text-light);
  margin-top: 12px;
  text-align: right;
}

/* Status Messages */
.status-msg {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 0.85rem;
  margin-bottom: 16px;
  display: none;
}
.status-msg.success { display: block; background: var(--green-light); color: var(--green); }
.status-msg.error { display: block; background: var(--red-light); color: var(--red); }
.status-msg.info { display: block; background: var(--blue-light); color: var(--blue); }

/* Loading */
.loading {
  display: none;
  text-align: center;
  padding: 30px;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--brown);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 600px) {
  .header h1 { font-size: 1.4rem; letter-spacing: 2px; }
  .content { padding: 16px 12px; }
  .search-row { flex-direction: column; }
  .btn { width: 100%; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .filter-row { flex-direction: column; }
  .view-toggle { flex-wrap: wrap; }
}
</style>
</head>
<body>

<div class="header">
  <h1>AM:PM</h1>
  <p>Client Dashboard</p>
</div>

<div class="content">
  <div class="search-box">
    <label>Search Client Purchase History</label>
    <div class="search-row">
      <input type="tel" id="phoneInput" placeholder="Enter mobile number (e.g. 9876543210)" maxlength="10" onkeydown="if(event.key==='Enter')searchClient()">
      <button class="btn btn-primary" id="searchBtn" onclick="searchClient()">Search</button>
    </div>
    <div class="search-hint">Enter 10-digit mobile number without country code</div>
  </div>

  <div id="searchLoading" class="loading">
    <div class="spinner"></div>
    <div style="color:var(--text-light);font-size:0.85rem;">Searching records...</div>
  </div>

  <div id="searchStatus" class="status-msg"></div>

  <div id="clientProfile" class="client-profile">
    <div class="client-name" id="cpName">-</div>
    <div class="client-meta">
      <span id="cpPhone">-</span>
      <span id="cpCode">-</span>
      <span id="cpType">-</span>
      <span id="cpCity">-</span>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="cpTotal">-</div>
        <div class="stat-label">Total Spend</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpItems">-</div>
        <div class="stat-label">Total Items</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpVisits">-</div>
        <div class="stat-label">Unique Bills</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpLast">-</div>
        <div class="stat-label">Last Purchase</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpStore">-</div>
        <div class="stat-label">Top Store</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpDept">-</div>
        <div class="stat-label">Top Department</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpAvg">-</div>
        <div class="stat-label">Avg. Bill Value</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="cpDisc">-</div>
        <div class="stat-label">Avg. Discount</div>
      </div>
    </div>
  </div>

  <div id="historySection" class="history-section">
    <h3>Purchase History</h3>
    <div class="filter-row">
      <select id="filterStore" onchange="applyFilters()">
        <option value="">All Stores</option>
      </select>
      <select id="filterDept" onchange="applyFilters()">
        <option value="">All Departments</option>
      </select>
      <select id="filterSubCat" onchange="applyFilters()">
        <option value="">All Sub-Categories</option>
      </select>
      <select id="filterSeason" onchange="applyFilters()">
        <option value="">All Seasons</option>
      </select>
      <select id="filterYear" onchange="applyFilters()">
        <option value="">All Years</option>
      </select>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" onclick="setView('summary')">Summary View</button>
      <button class="view-btn" onclick="setView('detail')">Detail View</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="historyHead"></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
    <div class="record-count" id="recordCount"></div>
  </div>
</div>

<script>
// ===== Supabase Config =====
var SB_URL = 'https://exloaxjttpvagoftsjbt.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4bG9heGp0dHB2YWdvZnRzamJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzE1MzAsImV4cCI6MjEwNzIwNzUzMH0.Po0m9YKci5vDf0A61usu7OKL6Jx9mJOd8ls4CWOvZig';

function sbHeaders(prefer) {
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json',
    'Prefer': prefer || 'return=minimal'
  };
}

// ===== View Toggle =====
var currentView = 'summary';
function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent.toLowerCase().indexOf(v) >= 0);
  });
  applyFilters();
}

// ===== Client Lookup =====
var allRecords = [];

function searchClient() {
  var phone = document.getElementById('phoneInput').value.trim().replace(/\D/g, '');
  if (phone.length < 10) {
    showStatus('searchStatus', 'Enter a valid 10-digit mobile number', 'error');
    return;
  }
  phone = phone.slice(-10);

  hideEl('clientProfile');
  hideEl('historySection');
  hideEl('searchStatus');
  showEl('searchLoading');
  document.getElementById('searchBtn').disabled = true;

  fetch(SB_URL + '/client_purchases?client_phone=like.*' + phone + '&order=purchase_date.desc&limit=5000', {
    headers: sbHeaders()
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    hideEl('searchLoading');
    document.getElementById('searchBtn').disabled = false;

    if (!data || !data.length) {
      showStatus('searchStatus', 'No purchase records found for this number', 'info');
      return;
    }

    allRecords = data;
    renderProfile(data);
    populateFilters(data);
    renderHistory(data);
    showEl('clientProfile');
    showEl('historySection');
  })
  .catch(function(err) {
    hideEl('searchLoading');
    document.getElementById('searchBtn').disabled = false;
    showStatus('searchStatus', 'Error searching records. Please try again.', 'error');
  });
}

function renderProfile(data) {
  document.getElementById('cpName').textContent = data[0].client_name || 'Unknown';
  document.getElementById('cpPhone').textContent = '\u{1F4F1} ' + formatPhone(data[0].client_phone);
  document.getElementById('cpCode').textContent = data[0].customer_code ? '\u{1F3F7} Code: ' + data[0].customer_code : '';
  document.getElementById('cpType').textContent = data[0].customer_type ? '\u{1F464} ' + data[0].customer_type : '';
  var city = data[0].city || '';
  var state = data[0].state || '';
  document.getElementById('cpCity').textContent = city ? '\u{1F4CD} ' + city + (state ? ', ' + state : '') : '';

  // Total Spend
  var total = data.reduce(function(s, r) { return s + (parseFloat(r.amount) || 0); }, 0);
  document.getElementById('cpTotal').textContent = formatCurrency(total);

  // Total Items (sum of quantity)
  var totalItems = data.reduce(function(s, r) { return s + (parseInt(r.quantity) || 1); }, 0);
  document.getElementById('cpItems').textContent = totalItems;

  // Unique Bills
  var uniqueBills = {};
  data.forEach(function(r) { if (r.invoice_no) uniqueBills[r.invoice_no] = 1; });
  document.getElementById('cpVisits').textContent = Object.keys(uniqueBills).length;

  // Last Purchase
  var dates = data.map(function(r) { return r.purchase_date; }).filter(Boolean).sort();
  var lastDate = dates.length ? dates[dates.length - 1] : '-';
  document.getElementById('cpLast').textContent = lastDate !== '-' ? formatDate(lastDate) : '-';

  // Top Store
  document.getElementById('cpStore').textContent = topValue(data, 'store');

  // Top Department
  document.getElementById('cpDept').textContent = topValue(data, 'department');

  // Average Bill Value (by unique bills)
  var billCount = Object.keys(uniqueBills).length || 1;
  document.getElementById('cpAvg').textContent = formatCurrency(total / billCount);

  // Average Discount
  var discounts = data.filter(function(r) { return r.discount_pct != null && r.discount_pct !== ''; });
  if (discounts.length) {
    var avgDisc = discounts.reduce(function(s, r) { return s + (parseFloat(r.discount_pct) || 0); }, 0) / discounts.length;
    document.getElementById('cpDisc').textContent = avgDisc.toFixed(1) + '%';
  } else {
    document.getElementById('cpDisc').textContent = '-';
  }
}

function topValue(data, field) {
  var counts = {};
  data.forEach(function(r) {
    if (r[field]) counts[r[field]] = (counts[r[field]] || 0) + 1;
  });
  var top = '-', max = 0;
  for (var k in counts) {
    if (counts[k] > max) { max = counts[k]; top = k; }
  }
  return top;
}

function populateFilters(data) {
  var stores = {}, depts = {}, subcats = {}, seasons = {}, years = {};
  data.forEach(function(r) {
    if (r.store) stores[r.store] = 1;
    if (r.department) depts[r.department] = 1;
    if (r.sub_category) subcats[r.sub_category] = 1;
    if (r.quarter_season) seasons[r.quarter_season] = 1;
    if (r.purchase_date) {
      var y = r.purchase_date.substring(0, 4);
      if (y) years[y] = 1;
    }
  });

  fillSelect('filterStore', stores, 'All Stores');
  fillSelect('filterDept', depts, 'All Departments');
  fillSelect('filterSubCat', subcats, 'All Sub-Categories');
  fillSelect('filterSeason', seasons, 'All Seasons');
  fillSelect('filterYear', years, 'All Years');
}

function fillSelect(id, obj, defaultLabel) {
  var sel = document.getElementById(id);
  sel.innerHTML = '<option value="">' + defaultLabel + '</option>';
  Object.keys(obj).sort().forEach(function(k) {
    sel.innerHTML += '<option value="' + k + '">' + k + '</option>';
  });
}

function applyFilters() {
  var store = document.getElementById('filterStore').value;
  var dept = document.getElementById('filterDept').value;
  var subcat = document.getElementById('filterSubCat').value;
  var season = document.getElementById('filterSeason').value;
  var year = document.getElementById('filterYear').value;

  var filtered = allRecords.filter(function(r) {
    if (store && r.store !== store) return false;
    if (dept && r.department !== dept) return false;
    if (subcat && r.sub_category !== subcat) return false;
    if (season && r.quarter_season !== season) return false;
    if (year && (!r.purchase_date || r.purchase_date.substring(0, 4) !== year)) return false;
    return true;
  });
  renderHistory(filtered);
}

function renderHistory(data) {
  var thead = document.getElementById('historyHead');
  var tbody = document.getElementById('historyBody');

  if (currentView === 'summary') {
    thead.innerHTML = '<tr>' +
      '<th>Date</th><th>Invoice</th><th>Store</th><th>Department</th>' +
      '<th>Sub Category</th><th>Qty</th><th>MRP</th><th>Disc%</th><th>Amount</th>' +
      '</tr>';
  } else {
    thead.innerHTML = '<tr>' +
      '<th>Date</th><th>Time</th><th>Invoice</th><th>Store</th><th>Department</th>' +
      '<th>Sub Category</th><th>Product Category</th><th>Article No</th>' +
      '<th>Color</th><th>Size</th><th>Qty</th><th>MRP</th><th>Disc%</th>' +
      '<th>Amount</th><th>Season</th><th>Customer Type</th>' +
      '</tr>';
  }

  if (!data.length) {
    var cols = currentView === 'summary' ? 9 : 16;
    tbody.innerHTML = '<tr><td colspan="' + cols + '" class="no-data">No records match your filters</td></tr>';
    document.getElementById('recordCount').textContent = '';
    return;
  }

  var html = '';
  var totalFiltered = 0;
  var totalQty = 0;
  data.forEach(function(r) {
    var amt = parseFloat(r.amount) || 0;
    totalFiltered += amt;
    totalQty += parseInt(r.quantity) || 1;
    var amtClass = amt < 0 ? 'amt-neg' : 'amt-pos';

    if (currentView === 'summary') {
      html += '<tr>' +
        '<td>' + (r.purchase_date ? formatDate(r.purchase_date) : '-') + '</td>' +
        '<td>' + esc(r.invoice_no || '-') + '</td>' +
        '<td>' + esc(r.store || '-') + '</td>' +
        '<td>' + esc(r.department || '-') + '</td>' +
        '<td>' + esc(r.sub_category || '-') + '</td>' +
        '<td style="text-align:center;">' + (r.quantity || '-') + '</td>' +
        '<td style="text-align:right;">' + (r.mrp ? formatCurrency(parseFloat(r.mrp)) : '-') + '</td>' +
        '<td style="text-align:center;">' + (r.discount_pct != null && r.discount_pct !== '' ? parseFloat(r.discount_pct).toFixed(0) + '%' : '-') + '</td>' +
        '<td style="text-align:right;" class="' + amtClass + '">' + formatCurrency(amt) + '</td>' +
        '</tr>';
    } else {
      html += '<tr>' +
        '<td>' + (r.purchase_date ? formatDate(r.purchase_date) : '-') + '</td>' +
        '<td>' + esc(r.bill_time || '-') + '</td>' +
        '<td>' + esc(r.invoice_no || '-') + '</td>' +
        '<td>' + esc(r.store || '-') + '</td>' +
        '<td>' + esc(r.department || '-') + '</td>' +
        '<td>' + esc(r.sub_category || '-') + '</td>' +
        '<td>' + esc(r.product_category || '-') + '</td>' +
        '<td>' + esc(r.article_number || '-') + '</td>' +
        '<td>' + esc(r.color || '-') + '</td>' +
        '<td>' + esc(r.size || '-') + '</td>' +
        '<td style="text-align:center;">' + (r.quantity || '-') + '</td>' +
        '<td style="text-align:right;">' + (r.mrp ? formatCurrency(parseFloat(r.mrp)) : '-') + '</td>' +
        '<td style="text-align:center;">' + (r.discount_pct != null && r.discount_pct !== '' ? parseFloat(r.discount_pct).toFixed(0) + '%' : '-') + '</td>' +
        '<td style="text-align:right;" class="' + amtClass + '">' + formatCurrency(amt) + '</td>' +
        '<td>' + esc(r.quarter_season || '-') + '</td>' +
        '<td>' + esc(r.customer_type || '-') + '</td>' +
        '</tr>';
    }
  });
  tbody.innerHTML = html;
  document.getElementById('recordCount').textContent = data.length + ' records | ' + totalQty + ' items | Total: ' + formatCurrency(totalFiltered);
}

// ===== Helpers =====
function formatCurrency(n) {
  if (isNaN(n)) return '-';
  var prefix = n < 0 ? '-₹' : '₹';
  return prefix + Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

function formatDate(d) {
  if (!d) return '-';
  var parts = d.split('-');
  if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
  return d;
}

function formatPhone(p) {
  if (!p) return '';
  p = p.toString().replace(/\D/g, '').slice(-10);
  return p.substring(0, 5) + ' ' + p.substring(5);
}

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showEl(id) { document.getElementById(id).style.display = 'block'; }
function hideEl(id) { document.getElementById(id).style.display = 'none'; }

function showStatus(id, msg, type) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}
</script>
