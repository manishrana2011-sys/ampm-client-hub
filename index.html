<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMPM Client Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #faf7f3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .header { text-align: center; margin-bottom: 40px; }
  .header h1 { font-family: 'EB Garamond', Georgia, serif; color: #864624; font-size: 36px; font-weight: 500; letter-spacing: 5px; }
  .header p { color: #8a7060; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-top: 8px; }
  .stores { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
  .store-card {
    background: #fff; border: 2px solid #d4c4b4; border-radius: 12px; padding: 28px 36px;
    text-align: center; cursor: pointer; transition: 0.2s; text-decoration: none; min-width: 160px;
  }
  .store-card:hover { border-color: #864624; background: #f9f0e7; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(134,70,36,0.15); }
  .store-card .icon { font-size: 32px; margin-bottom: 8px; }
  .store-card .name { font-size: 15px; font-weight: 600; color: #2c1a0e; }
  .store-card .sub { font-size: 11px; color: #8a7060; margin-top: 4px; }
  .note { text-align: center; color: #8a7060; font-size: 11px; margin-top: 30px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="header">
    <h1>AMPM</h1>
    <p>Client Communication Hub</p>
  </div>
  <div class="stores">
    <a class="store-card" href="AMPM_Emporio.html">
      <div class="icon">🏛️</div>
      <div class="name">Emporio</div>
      <div class="sub">Vasant Kunj</div>
    </a>
    <a class="store-card" href="AMPM_KhanMarket.html">
      <div class="icon">🏪</div>
      <div class="name">Khan Market</div>
      <div class="sub">Central Delhi</div>
    </a>
    <a class="store-card" href="AMPM_Mehrauli.html">
      <div class="icon">🏰</div>
      <div class="name">Mehrauli</div>
      <div class="sub">Kila</div>
    </a>
    <a class="store-card" href="AMPM_ClientDashboard.html" style="border-color:#864624;background:#fdf8f3;">
      <div class="icon">📊</div>
      <div class="name">Client Dashboard</div>
      <div class="sub">Purchase History & Data</div>
    </a>
  </div>
  <div class="note">Each store's data is saved locally in the browser.<br>Phone numbers are never stored.</div>
</body>
</html>
